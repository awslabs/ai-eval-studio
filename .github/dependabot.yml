# Dependabot: a monthly version-update pull request per lockfile, and security
# fixes as soon as an alert is raised.
#
# Minor and patch releases are grouped into one pull request per lockfile, so a
# month of routine bumps is reviewed and tested once. Major releases are left
# out of the group and arrive as their own pull requests, because each can need
# code changes and is easier to judge alone. Security fixes have their own
# group, so every fix for a lockfile lands in a single pull request instead of
# one per advisory.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      frontend-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
    groups:
      backend-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      backend-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /infra
    schedule:
      interval: monthly
    groups:
      infra-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      infra-security:
        applies-to: security-updates
        patterns: ["*"]
