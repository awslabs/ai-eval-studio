[project]
name = "{project_name}"
version = "0.1.0"
description = "LLM evaluation harness generated by AI Eval Studio"
requires-python = ">=3.11"
dependencies = [
    "deepeval=={deepeval_version}",
    "boto3>=1.35",
    "awscrt>=0.20",
    "pandas>=2.0",
    # Mantle adapter parity. The harness venv runs the same
    # BedrockMantleModel as the coordinator (templates ↔ services
    # parity), so it needs httpx for the raw HTTPS path and certifi for
    # the *.api.aws Amazon Trust Services CA chain. Pin floors match
    # backend/pyproject.toml so both venvs resolve identical wheels.
    "httpx>=0.28.0",
    "certifi>=2024.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
